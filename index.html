<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js"></script>

    <title>Calcify</title>
  </head>
  <body>
    <header>
      <h1>Calcify</h1>
    </header>

    <main>
      <hr />
      <h1>Welcome to Calcify</h1>
      <p>Write and Click the operators</p>

      <input type="text" id="Input" name="Input">
      <input type="text" id="Input2" name="Input2">

      <button onclick="add()"> + </button>
      <button onclick="subtract()"> - </button>
      <button onclick="multiply()"> × </button>
      <button onclick="divide()"> ÷ </button>
      <button onclick="power()"> ^ </button>
      <button onclick="restDivision()"> mod </button>
      <br/>
      <button onclick="clearAll()">Clear</button>

      <h2 id="result">0</h2>

      <br/>
      <br/>
      <br/>

      <p>Odd or Even checker!</p>
      <input type="text" id="OddOrEven" name="OddOrEven">
      <button onclick="oddOreven()"> Check! </button>

      <h2 id="result2">Type the number and click (check)</h2>

      <br/>
      <br/>
      <br/>

      <h2>History</h2>
      <p id="calcHistory"></p>
      <button onclick="clearHistory()">Clear</button>
    </main>

    <footer>
      <p>&copy; 2026 Calcify</p>
    </footer>
  </body>
</html>
