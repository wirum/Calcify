<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css" />
  <script src="js/script.js"></script>

  <title>Calcify V3</title>
</head>

<body>
  <header>
    <h1>
        Calcify
        <span class="badge">V3</span>
    </h1>
    <h3>Renewed with a whole new logic!</h3>
  </header>

  <main>
    <div class="Calculator">
      <h1>Welcome to Calcify</h1>
      <p>Write down your expression</p>

      <input type="text" id="Input" name="Input">

      <div class="operators">
        <button onclick="calculate()"> Calcify </button>
      </div>
      <button onclick="clearAll()">Clear</button>

      <div class="result" aria-live="polite">
        <h2 id="result">Result: 0</h2>
        <button onclick="copyResult()">Copy</button>
      </div>
      <br />
      <br />
      <br />
      
      <div class="HowTo">
          <h2>How can I calculate this?</h2>
          <button onclick="showMe()">Show Me!</button>
          <p id="howTo"></p>
      </div>

    </div>
    <div class="History">
      <h2>History</h2>
      <p id="calcHistory"></p>
      <button onclick="clearHistory()">Clear</button>
      <button onclick="copyHistory()">Copy</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Calcify - Made by Lucas</p>
  </footer>
</body>

</html>
